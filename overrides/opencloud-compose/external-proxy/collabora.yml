---
services:
  opencloud:
    environment:
      # WOPI GetFile (collaboration container) follows CS3 download URLs.
      # Default bind is 127.0.0.1:9158 inside opencloud, so collaboration gets
      # connection refused on http://localhost:9158/data/spaces/...
      # Bind on the Docker network and advertise that URL. Do not publish 9158
      # on the host (opencloud still maps only 127.0.0.1:9200).
      STORAGE_USERS_HTTP_ADDR: 0.0.0.0:9158
      STORAGE_USERS_DATA_SERVER_URL: http://opencloud:9158/data
  collaboration:
    ports:
      # expose the wopi server on localhost
      - "127.0.0.1:9300:9300"
    environment:
      # OpenCloud 7.3.0+: collaboration added COLLABORATION_EVENTS_ENDPOINT (defaults 127.0.0.1:9233).
      # MICRO_REGISTRY_ADDRESS=opencloud:9233 (weboffice overlay) registers the service, but the
      # events bus + nats-js-kv store still target loopback inside this container → WOPI :9300 502.
      OC_EVENTS_ENDPOINT: opencloud:9233
      COLLABORATION_EVENTS_ENDPOINT: opencloud:9233
      OC_PERSISTENT_STORE_NODES: opencloud:9233
      COLLABORATION_STORE_NODES: opencloud:9233
  collabora:
    ports:
      # expose the collabora server on localhost
      - "127.0.0.1:9980:9980"
