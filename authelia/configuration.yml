---
###############################################################################
# KM0 Authelia — 2FA opcional para Cloud (detrás de Dex)
#
# PLANTILLA. No editar los valores __PLACEHOLDER__ a mano: se renderizan a
# `configuration.gen.yml` con `scripts/setup-authelia-secrets.sh` (que inyecta
# los secretos). docker-compose monta el fichero *.gen.yml, no este.
#
# Rol: Authelia actúa como PROVEEDOR OIDC para Dex (cliente `dex`). Valida la
# contraseña contra el mismo LDAP de OpenCloud IDM y añade el 2º factor
# (TOTP / WebAuthn) SOLO a los usuarios del grupo `2fa-enabled` (opt-in).
###############################################################################

theme: 'dark'

# CA del LDAPS de OpenCloud IDM (copiada por el init sidecar a /certs).
certificates_directory: '/certs'

server:
  address: 'tcp://0.0.0.0:9091'
  # Logo / favicon / locales KM0 (ver assets/).
  asset_path: '/config/assets'

log:
  level: 'info'
  format: 'json'

totp:
  issuer: 'KM0 Digital'
  algorithm: 'sha1'
  digits: 6
  period: 30
  skew: 1

webauthn:
  disable: false
  display_name: 'KM0 Digital'
  timeout: '60s'
  attestation_conveyance_preference: 'indirect'
  user_verification: 'preferred'

# Recuperación / reset por email (enlace firmado).
identity_validation:
  reset_password:
    jwt_secret: '__RESET_JWT_SECRET__'

authentication_backend:
  refresh_interval: '5m'
  # Password reset against OpenCloud IDM is unreliable; keep recovery focused on 2FA.
  password_reset:
    disable: true
  ldap:
    implementation: 'custom'
    address: 'ldaps://opencloud:9235'
    timeout: '10s'
    start_tls: false
    tls:
      server_name: 'opencloud'
      skip_verify: false
      minimum_version: 'TLS1.2'
    base_dn: 'o=libregraph-idm'
    additional_users_dn: 'ou=users'
    users_filter: '(&({username_attribute}={input})(objectClass=inetOrgPerson))'
    additional_groups_dn: 'ou=groups'
    groups_filter: '(&(member={dn})(objectClass=groupOfNames))'
    attributes:
      username: 'uid'
      display_name: 'displayName'
      mail: 'mail'
      group_name: 'cn'
    permit_referrals: false
    user: 'uid=libregraph,ou=sysusers,o=libregraph-idm'
    password: '__LDAP_BIND_PW__'

# Política del portal propio (no-OIDC). Las políticas por cliente OIDC se
# definen en identity_providers.oidc.authorization_policies.
access_control:
  default_policy: 'one_factor'

session:
  name: 'authelia_session'
  same_site: 'lax'
  secret: '__SESSION_SECRET__'
  # Sesiones largas + recordar dispositivo (issue: no relogar a diario).
  expiration: '7d'
  inactivity: '7d'
  remember_me: '90d'
  cookies:
    - domain: 'km0digital.com'
      authelia_url: 'https://id.km0digital.com'
      name: 'authelia_session'
      expiration: '7d'
      inactivity: '7d'
      remember_me: '90d'
  redis:
    host: 'redis'
    port: 6379
    password: '__REDIS_PASSWORD__'
    database_index: 0

regulation:
  max_retries: 4
  find_time: '2m'
  ban_time: '5m'

storage:
  encryption_key: '__STORAGE_ENCRYPTION_KEY__'
  local:
    path: '/config/db.sqlite3'

# Notificaciones (verificación de identidad / reset de 2FA) vía SMTP de km0-mail.
# Requiere un buzón noreply@km0digital.com (SASL en submission 587).
notifier:
  # Postfix submission uses a local/self-signed cert (CN=localhost); skip verify.
  disable_startup_check: false
  smtp:
    address: 'submission://mail.km0digital.com:587'
    timeout: '10s'
    username: '__SMTP_USERNAME__'
    password: '__SMTP_PASSWORD__'
    sender: 'KM0 Digital <noreply@km0digital.com>'
    subject: '[KM0] {title}'
    startup_check_address: 'postmaster@km0digital.com'
    tls:
      server_name: 'mail.km0digital.com'
      skip_verify: true
      minimum_version: 'TLS1.2'

identity_providers:
  oidc:
    hmac_secret: '__OIDC_HMAC_SECRET__'
    # Clave de firma de tokens (PEM generada por el setup en /secrets).
    jwks:
      - key_id: 'km0-oidc'
        algorithm: 'RS256'
        use: 'sig'
        key: |
          __OIDC_JWKS_KEY_PEM__
    # Opt-in: one_factor por defecto, two_factor solo si el usuario está en el
    # grupo LDAP `2fa-enabled`.
    authorization_policies:
      cloud_optional_2fa:
        default_policy: 'one_factor'
        rules:
          - policy: 'two_factor'
            subject:
              - 'group:2fa-enabled'
    clients:
      - client_id: 'dex'
        client_name: 'KM0 Cloud'
        client_secret: '__OIDC_DEX_CLIENT_SECRET_HASH__'
        public: false
        authorization_policy: 'cloud_optional_2fa'
        require_pkce: false
        consent_mode: 'implicit'
        redirect_uris:
          - 'https://cloud.km0digital.com/dex/callback'
        scopes:
          - 'openid'
          - 'profile'
          - 'email'
          - 'groups'
          - 'offline_access'
        response_types:
          - 'code'
        grant_types:
          - 'authorization_code'
          - 'refresh_token'
        access_token_signed_response_alg: 'none'
        userinfo_signed_response_alg: 'none'
        token_endpoint_auth_method: 'client_secret_basic'
