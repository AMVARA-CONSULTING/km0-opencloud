<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kilómetro 0 Digital — Cerrando sesión…</title>
  <meta name="robots" content="noindex" />
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: system-ui, sans-serif; background: #0B1220; color: #E6E9ED;
    }
    p { opacity: 0.7; }
  </style>
</head>
<body>
  <p>Cerrando sesión…</p>
  <script>
    (function () {
      'use strict';
      var DEFAULT_RD = 'https://auth.km0digital.com/login?service=cloud&signed_out=1';
      var ALLOWED = [
        'https://auth.km0digital.com/',
        'https://cloud.km0digital.com/',
        'https://mail.km0digital.com/',
        'https://km0digital.com/'
      ];

      function safeRd(raw) {
        if (!raw) return DEFAULT_RD;
        try {
          var u = new URL(raw, location.origin);
          if (u.protocol !== 'https:') return DEFAULT_RD;
          for (var i = 0; i < ALLOWED.length; i++) {
            if (u.href.indexOf(ALLOWED[i]) === 0) return u.href;
          }
        } catch (_) {}
        return DEFAULT_RD;
      }

      var rd = safeRd(new URLSearchParams(location.search).get('rd'));

      function go() {
        location.replace(rd);
      }

      // Destroy Authelia session (HttpOnly cookie). Continue even if it fails.
      fetch('/api/logout', {
        method: 'POST',
        credentials: 'include',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: '{}'
      }).then(go, go);
    })();
  </script>
</body>
</html>
